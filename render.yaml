services:
  - type: web
    name: medlab-api
    runtime: node
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@9.12.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @medlab/shared-types build && pnpm --filter @medlab/api build
    preDeployCommand: pnpm --filter @medlab/api exec prisma migrate deploy --schema prisma/schema.prisma
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 7
      - key: FRONTEND_URL
        value: https://medlab-web.onrender.com
      - key: CORS_ORIGINS
        value: https://medlab-web.onrender.com
      - key: ML_SERVICE_URL
        value: https://medlab-ml.onrender.com
      - key: ML_SERVICE_TOKEN
        generateValue: true
      - key: ML_TIMEOUT_MS
        value: 5000
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: web
    name: medlab-ml
    runtime: python
    plan: free
    rootDir: apps/ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

  - type: web
    name: medlab-web
    runtime: node
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@9.12.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @medlab/shared-types build && pnpm --filter @medlab/web build
    startCommand: pnpm --filter @medlab/web start -- -H 0.0.0.0 -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_BASE_URL
        value: https://medlab-api.onrender.com
