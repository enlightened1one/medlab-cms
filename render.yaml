services:
  - type: web
    name: medlab-api
    runtime: node
    plan: free
    buildCommand: npx pnpm@9.12.0 install --frozen-lockfile --prod=false && npx pnpm@9.12.0 --filter @medlab/shared-types build && npx pnpm@9.12.0 --filter @medlab/api build
    startCommand: npx pnpm@9.12.0 --filter @medlab/api exec prisma migrate deploy --schema prisma/schema.prisma && node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 7
      - key: FRONTEND_URL
        value: https://medlab-web.onrender.com
      - key: CORS_ORIGINS
        value: https://medlab-web.onrender.com
      - key: ML_SERVICE_URL
        value: https://medlab-ml.onrender.com
      - key: ML_SERVICE_TOKEN
        sync: false
      - key: ML_TIMEOUT_MS
        value: 5000
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""
      - key: EMAIL_FROM
        value: no-reply@medlab.local

  - type: web
    name: medlab-ml
    runtime: python
    plan: free
    rootDir: apps/ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ML_SERVICE_TOKEN
        sync: false

  - type: web
    name: medlab-web
    runtime: node
    plan: free
    buildCommand: npx pnpm@9.12.0 install --frozen-lockfile --prod=false && npx pnpm@9.12.0 --filter @medlab/shared-types build && npx pnpm@9.12.0 --filter @medlab/web build
    startCommand: npx pnpm@9.12.0 --filter @medlab/web exec next start -H 0.0.0.0 -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_BASE_URL
        value: https://medlab-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://medlab-api.onrender.com/api/v1
