services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: medlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: medlab
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medlab"]
      interval: 5s
      retries: 10
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: medlab
      POSTGRES_PASSWORD: medlab_test_only
      POSTGRES_DB: medlab_test
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["pgtestdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medlab -d medlab_test"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
  pgtestdata:
